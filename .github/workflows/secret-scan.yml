name: secret-scan

# Server-side backstop for the local pre-commit / pre-push guards, since those
# can be bypassed with --no-verify. Fails the build if any secret or internal
# identifier reaches a push or pull request.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    # Runs the open-source gitleaks CLI directly instead of gitleaks-action,
    # which requires a GITLEAKS_LICENSE secret for organizations. Secrets are
    # never passed to pull requests from forks, so the action always failed there.
    env:
      GITLEAKS_VERSION: 8.18.4 # keep in sync with .pre-commit-config.yaml
      GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Run gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # On pull requests from forks, restore the base branch config and
          # ignore list so an external PR cannot weaken the scan by editing
          # them. Only the working tree is overwritten; the git history being
          # scanned is untouched. Changes take effect once merged into the base.
          if [ -n "$BASE_REF" ] && [ "$IS_FORK_PR" = "true" ]; then
            git show "origin/${BASE_REF}:.gitleaks.toml" > .gitleaks.toml
            git show "origin/${BASE_REF}:.gitleaksignore" > .gitleaksignore 2>/dev/null || : > .gitleaksignore
          fi
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # Exclude the Lob detector — it flags test_* function names as secrets.
          extra_args: --only-verified --exclude-detectors=lob

  pre-commit:
    name: pre-commit hooks (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Enforce the same local hooks server-side (incl. the internal-data guard).
      # trufflehog is a pre-push stage hook and is covered by its own job above.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit
