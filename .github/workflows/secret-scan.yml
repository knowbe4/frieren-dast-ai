name: secret-scan

# Server-side backstop for the local pre-commit / pre-push guards, since those
# can be bypassed with --no-verify. Fails the build if any secret or internal
# identifier reaches a push or pull request.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # Exclude the Lob detector — it flags test_* function names as secrets.
          extra_args: --only-verified --exclude-detectors=lob

  pre-commit:
    name: pre-commit hooks (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Enforce the same local hooks server-side (incl. the internal-data guard).
      # trufflehog is a pre-push stage hook and is covered by its own job above.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-commit
