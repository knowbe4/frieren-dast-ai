name: tests

# Runs the unit suite and the ruff lint gate on every push and PR. This is the
# server-side backstop for `make test` / `make lint`, which until now were a
# local-only gate — nothing stopped a red suite from merging.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: pytest (unit) + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint gate (F/E9)
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit/ -q
