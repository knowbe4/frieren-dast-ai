# Directory listing detection — identifies web servers that expose directory
# index pages, allowing attackers to enumerate application files.
# Covers OWASP A05 (Security Misconfiguration) / CWE-548.

rules:
  - id: directory-listing
    title: Directory Listing Enabled
    severity: medium
    cwe: CWE-548
    description: >
      The response body contains directory listing markers generated by Apache,
      Nginx, IIS, or Python's built-in HTTP server. Directory listing allows
      attackers to enumerate files and directories without guessing paths.
    match:
      body_regex: '<title>Index of /|Directory listing for /|\[To Parent Directory\]|Parent Directory</a>.*Last modified'
      body_max_scan_bytes: 2000
    conditions:
      content_type: html
      status_codes: [200]
    evidence_template: "Directory listing is enabled at '{path}'"
    needs_ai_validation: true
