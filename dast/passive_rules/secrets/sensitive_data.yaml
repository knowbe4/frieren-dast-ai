# Sensitive data exposure checks — scans response bodies for hardcoded
# credentials, secret keys, tokens, and other high-value secrets.
# Patterns follow TruffleHog / Semgrep-rules conventions.
# Covers OWASP A02 (Cryptographic Failures) / CWE-312.
#
# Rules marked needs_ai_validation: true are forwarded to the LLM validator
# before a finding is raised, to suppress false positives such as example
# keys, presigned URLs, and placeholder values.
#
# NOTE: The matched secret value is always REDACTED (characters replaced with *)
# before being stored in evidence or passed to the AI validator.

rules:
  - id: aws-access-key
    title: AWS Access Key Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a string matching an AWS access key ID
      (AKIA/ASIA/AROA/AIDA prefix). Exposed key IDs allow attackers to enumerate
      IAM resources and, combined with the secret key, gain full AWS API access.
      Presigned S3 URLs (X-Amz-Credential) are suppressed in the engine before
      this rule fires.
    match:
      # Negative lookahead excludes % and / so keys inside presigned URLs
      # (KEYID%2FDATE... or KEYID/DATE...) are never matched — only bare key IDs.
      body_regex: '(?<![A-Z0-9])(AKIA|ASIA|AROA|AIDA)[A-Z0-9]{16}(?![A-Z0-9%/])'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching AWS access key ID"
    needs_ai_validation: true

  - id: aws-secret-key
    title: AWS Secret Key Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a string matching an AWS secret access key
      (40-character base64 value adjacent to a key/secret label). This provides
      direct AWS API authentication.
    match:
      body_regex: '(?:aws.{0,20})?(?:secret|key)(?:.{0,20})?[''"]?\s*[:=]\s*[''"]?([A-Za-z0-9/+]{40})[''"]?'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching AWS secret key"
    needs_ai_validation: true

  - id: github-token
    title: GitHub Token Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a string matching a GitHub personal access token
      or OAuth token (ghp_, gho_, ghs_, ghr_, ghu_ prefix). This grants direct
      access to GitHub repositories and organisation resources.
    match:
      body_regex: 'gh[pousr]_[A-Za-z0-9]{36}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching GitHub token"
    needs_ai_validation: true

  - id: slack-token
    title: Slack Token Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching a Slack API token
      (xoxb-, xoxp-, xoxe-, or xoxa- prefix). This grants access to Slack
      workspaces and messaging APIs.
    match:
      body_regex: 'xox[bpea]-[A-Za-z0-9\-]{10,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching Slack token"
    needs_ai_validation: true

  - id: private-key
    title: Private Key Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a PEM-encoded private key block (RSA, EC, or
      OpenSSH). Exposure of a private key compromises any TLS certificate,
      SSH key, or signing key associated with it.
    match:
      body_regex: '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a PEM private key block"
    needs_ai_validation: false

  - id: jwt-token
    title: JWT Token Exposed in Response
    severity: medium
    cwe: CWE-312
    description: >
      The response body contains a string matching a JSON Web Token
      (three base64url segments). Exposed JWTs may allow session hijacking
      or privilege escalation depending on the token's claims and expiry.
    match:
      body_regex: 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a JWT token"
    needs_ai_validation: true

  - id: credit-card
    title: Potential Credit Card Number in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a number matching common credit card number
      formats (Visa, Mastercard, Amex, Discover). Exposure of card numbers
      may violate PCI DSS requirements.
    match:
      body_regex: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a credit card number"
    needs_ai_validation: true

  - id: plaintext-credentials
    title: Plaintext Credentials in API Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a JSON field with a name indicating a secret
      (password, api_key, access_token, etc.) paired with a non-trivial value.
      Hardcoded or returned plaintext credentials should never appear in responses.
    match:
      body_regex: '"(?:password|passwd|secret|api_key|apikey|client_secret|access_token|auth_token|private_key)"\s*:\s*"(?=[^"]{8,})[^"]*[A-Za-z][^"]*[0-9][^"]*"'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains plaintext credential field"
    needs_ai_validation: true

  - id: generic-api-key
    title: Generic API Key or Secret in Response
    severity: medium
    cwe: CWE-312
    description: >
      The response body contains a field name indicating an API key or secret
      (api_key, apikey, api-secret, etc.) with a high-entropy value of at least
      20 characters. May indicate hardcoded or leaked credentials.
    match:
      body_regex: '(?:api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*[''"]([A-Za-z0-9_\-]{20,})[''"]'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a generic API key"
    needs_ai_validation: true

  - id: google-api-key
    title: Google API Key Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching a Google API key (AIza prefix
      followed by 35 alphanumeric characters). Exposed keys may allow abuse of
      Google Cloud services billed to the owner.
    match:
      body_regex: 'AIza[0-9A-Za-z\-_]{35}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a Google API key"
    needs_ai_validation: true

  - id: stripe-key
    title: Stripe API Key Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching a Stripe secret or publishable
      key (sk_live_, pk_live_, sk_test_, pk_test_). Live keys provide direct access
      to payment processing and customer data.
    match:
      body_regex: '(?:sk|pk)_(test|live)_[0-9a-zA-Z]{24,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a Stripe API key"
    needs_ai_validation: true

  - id: openai-api-key
    title: OpenAI API Key Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a string matching an OpenAI API key
      (sk- or sk-proj- prefix followed by a long high-entropy value). Exposed
      keys allow attackers to run inference billed to the owner and to access
      any fine-tuned models or files associated with the account.
    match:
      body_regex: 'sk-(?:proj-)?[A-Za-z0-9_-]{20,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching an OpenAI API key"
    needs_ai_validation: true

  - id: anthropic-api-key
    title: Anthropic API Key Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a string matching an Anthropic API key
      (sk-ant- prefix). Exposed keys allow attackers to run Claude inference
      billed to the owner.
    match:
      body_regex: 'sk-ant-[A-Za-z0-9_-]{20,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching an Anthropic API key"
    needs_ai_validation: true

  - id: gitlab-pat
    title: GitLab Personal Access Token Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains a string matching a GitLab personal access
      token (glpat- prefix). This grants direct access to GitLab repositories,
      pipelines, and organisation resources.
    match:
      body_regex: 'glpat-[A-Za-z0-9_-]{20,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a GitLab access token"
    needs_ai_validation: true

  - id: sendgrid-api-key
    title: SendGrid API Key Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching a SendGrid API key
      (SG. prefix with two dot-separated base64 segments). Exposed keys allow
      attackers to send email on behalf of the owner's domain (phishing risk).
    match:
      body_regex: 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a SendGrid API key"
    needs_ai_validation: true

  - id: twilio-api-key
    title: Twilio API Key SID Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching a Twilio API key SID
      (SK prefix followed by 32 hex characters). Combined with the secret it
      grants access to telephony/SMS APIs billed to the owner.
    match:
      body_regex: '(?<![A-Za-z0-9])SK[0-9a-fA-F]{32}(?![0-9a-fA-F])'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a Twilio API key SID"
    needs_ai_validation: true

  - id: npm-access-token
    title: npm Access Token Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching an npm access token
      (npm_ prefix followed by 36 characters). Exposed tokens allow publishing
      malicious package versions under the owner's account (supply-chain risk).
    match:
      body_regex: 'npm_[A-Za-z0-9]{36}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching an npm access token"
    needs_ai_validation: true

  - id: azure-storage-connection-string
    title: Azure Storage Connection String Exposed in Response
    severity: critical
    cwe: CWE-312
    description: >
      The response body contains an Azure Storage connection string
      (AccountKey= with a base64 secret). This grants full read/write access
      to the storage account's blobs, queues, and tables.
    match:
      body_regex: 'AccountKey=[A-Za-z0-9+/]{64,}={0,2}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains an Azure Storage AccountKey"
    needs_ai_validation: true

  - id: google-oauth-client-secret
    title: Google OAuth Client Secret Exposed in Response
    severity: high
    cwe: CWE-312
    description: >
      The response body contains a string matching a Google OAuth client secret
      (GOCSPX- prefix). Combined with the client ID it allows an attacker to
      impersonate the OAuth application.
    match:
      body_regex: 'GOCSPX-[A-Za-z0-9_-]{20,}'
      body_max_scan_bytes: 8192
    conditions:
      content_type: any
    evidence_template: "Response body contains a pattern matching a Google OAuth client secret"
    needs_ai_validation: true
